# Host-side reverse proxy: apex istokmebel.by + www → тот же контейнер istok
# (127.0.0.1:3008), что и new.istokmebel.by. Копировать в
#   /etc/nginx/sites-enabled/istokmebel.by.conf
# на сервере 89.169.54.11.
#
# Порядок cutover'а с Tilda:
#   1. Положить этот файл на сервер, `nginx -t && systemctl reload nginx`.
#      Пока DNS указывает на Tilda (45.155.60.8), этот vhost никем не
#      посещается — просто ждёт. Никакого влияния на production.
#   2. На domain.by / hoster.by поменять A-запись istokmebel.by с 45.155.60.8
#      на 89.169.54.11 (и добавить A www → 89.169.54.11). TTL 300.
#   3. Дождаться распространения (dig +short istokmebel.by @1.1.1.1).
#   4. Выпустить SSL-cert:
#        certbot --nginx -d istokmebel.by -d www.istokmebel.by \
#          --non-interactive --agree-tos -m lihoi.maksim@gmail.com --redirect
#      certbot перепишет файл: добавит 443-server, redirect 80→443, а также
#      301-редирект с www → apex (по флагу --redirect).
#   5. Проверить https://istokmebel.by и https://www.istokmebel.by
#      (последний должен редиректить на apex).
#
# ⚠️ new.istokmebel.by.conf оставляем как есть — preview-адрес продолжает
# работать и после cutover'а (полезно для отладки).

server {
  listen 80;
  listen [::]:80;
  server_name istokmebel.by www.istokmebel.by;

  # ACME challenge для certbot.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # 301 www → apex делаем на этом же уровне до certbot — чтобы канонический
  # хост был один. После certbot --redirect добавит зеркальный редирект на 443.
  if ($host = www.istokmebel.by) {
    return 301 http://istokmebel.by$request_uri;
  }

  location / {
    proxy_pass http://127.0.0.1:3008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
  }
}
