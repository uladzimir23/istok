# Host-side reverse proxy: admin.istokmebel.by.
#   /api/  /_/  → PocketBase (127.0.0.1:8093)   REST API, файлы, realtime, дашборд
#   /            → админка SPA (127.0.0.1:3009)
# Копировать в /etc/nginx/sites-enabled/admin.istokmebel.by.conf на сервере.
#
# После первого деплоя:
#   certbot --nginx -d admin.istokmebel.by --non-interactive --agree-tos \
#     -m lihoi.maksim@gmail.com --redirect
# certbot перепишет файл — добавит 443 server + redirect 80 → 443.

server {
  listen 80;
  listen [::]:80;
  server_name admin.istokmebel.by;

  # Загрузка фото товаров идёт через PB (/api/) — поднимаем лимит тела.
  client_max_body_size 25m;

  # ACME challenge для certbot.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # PocketBase: REST API, файлы, realtime (SSE) и суперюзер-дашборд (/_/).
  location ~ ^/(api|_)/ {
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # realtime (SSE): без буферизации, длинный таймаут.
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Админка SPA.
  location / {
    proxy_pass http://127.0.0.1:3009;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
  }
}
