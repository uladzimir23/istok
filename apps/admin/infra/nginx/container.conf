# Container nginx: раздаёт Vite SPA-сборку админки. Host-nginx (сервер) терминирует
# HTTPS и проксирует admin.istokmebel.by → 127.0.0.1:3008. API и дашборд PB
# роутит host-nginx (/api/, /_/ → PocketBase), сюда приходит только SPA.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Хешированные ассеты Vite (dist/assets/*) — immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: любой маршрут → index.html (react-router BrowserRouter).
  location / {
    try_files $uri /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml;
}
